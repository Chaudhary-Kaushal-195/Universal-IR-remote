<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050608" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Universal IR Hub</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="logo">UNIVERSAL HUB</div>
        <div id="connection-status" class="status-indicator status-demo">Demo Mode</div>
      </header>

      <div class="device-tabs" id="device-tabs">
        <div class="tab active" data-device="tv">TV Remote</div>
        <div class="tab" data-device="ac">AC Remote</div>
      </div>

      <main id="remote-content" class="glass remote-container">
        <!-- Remote UI will be injected here -->
      </main>

      <div class="config-trigger" id="config-btn">
        <i data-lucide="settings"></i>
      </div>

      <!-- Settings Modal -->
      <div class="modal" id="config-modal">
        <div class="modal-content glass">
          <!-- Auth Section -->
          <div id="auth-section" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 10px;">
            <p style="font-size: 0.9rem; margin-bottom: 10px;" id="auth-status">🔒 Not Logged In</p>
            <div id="auth-form" style="display: flex; flex-direction: column; gap: 8px;">
              <input type="email" id="auth-email" placeholder="Email" style="padding: 8px; font-size: 0.9rem;" />
              <input type="password" id="auth-password" placeholder="Password" style="padding: 8px; font-size: 0.9rem;" />
              <div style="display: flex; gap: 8px; margin-top: 5px;">
                <button class="primary-btn" id="login-btn" style="flex: 1; padding: 8px; font-size: 0.9rem;">Log In</button>
                <button class="primary-btn" id="signup-btn" style="flex: 1; padding: 8px; font-size: 0.9rem; background: transparent; border: 1px solid var(--accent-color);">Sign Up</button>
              </div>
            </div>
            <div id="auth-logged-in" style="display: none; align-items: center; justify-content: space-between;">
              <span id="user-email" style="font-size: 0.8rem; color: var(--accent-color); font-weight: bold;"></span>
              <button class="primary-btn" id="logout-btn" style="padding: 6px 12px; font-size: 0.8rem; background: var(--danger);">Log Out</button>
            </div>
          </div>

          <p>Choose Connection Type</p>
          
          <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button class="primary-btn" id="usb-connect" style="flex: 1;">
              <i data-lucide="usb"></i> USB (Arduino)
            </button>
            <button class="primary-btn" id="wifi-connect" style="flex: 1; background: var(--panel-bg); border: 1px solid var(--glass-border);">
              <i data-lucide="wifi"></i> WiFi (ESP32)
            </button>
          </div>

          <div id="wifi-config" style="display: none; flex-direction: column; gap: 10px;">
            <input type="text" id="esp-ip" placeholder="192.168.1.XX" />
            <button class="primary-btn" id="save-config">Save & Connect</button>
          </div>
          
          <hr style="opacity: 0.1; margin: 10px 0;">
          
          <div style="margin-bottom: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
            <p style="font-size: 0.9rem; margin-bottom: 5px;">Import Cloud Database</p>
            <select id="db-select" style="width: 100%; padding: 8px; margin-bottom: 8px; background: var(--panel-bg); color: white; border: 1px solid var(--glass-border); border-radius: 5px;">
              <option value="">-- Select TV Model --</option>
              <option value="Samsung TV">Samsung TV</option>
              <option value="LG TV">LG TV</option>
              <option value="Sony TV">Sony TV</option>
            </select>
            <button class="primary-btn" id="db-import-btn" style="background: var(--accent-color); font-size: 0.9rem; padding: 8px;">
              <i data-lucide="download" style="width:14px; height:14px; margin-right:5px"></i> Apply Profile
            </button>
          </div>
          
          <button class="primary-btn" id="learn-btn" style="background: var(--success)">
            <i data-lucide="mic" style="width:16px; height:16px; margin-right:8px"></i>
            Enter Learning Mode
          </button>
          <p id="learning-status" style="font-size: 0.8rem; color: var(--text-secondary); text-align: center;"></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Initialize Lucide icons on start
      window.onload = () => lucide.createIcons();
    </script>
  </body>
</html>
